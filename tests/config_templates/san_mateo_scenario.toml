# San Mateo County Highway Test - Scenario Configuration
# This is a minimal configuration for testing highway components with San Mateo County data

[scenario]
year = 2035
title = "San Mateo County Highway Test"
description = "Test run for highway network creation, skimming, and assignment using San Mateo County zones only"

[run]
# Single iteration test run
start_iteration = 1
end_iteration = 1
start_component = ""  # Start from beginning

# Run sequence: prepare network in initial, then assignment in global iteration
initial_components = [
    "prepare_network_highway",
]

global_iteration_components = [
    "highway",  # This does both assignment and skimming
]

final_components = [
    # Optional: Add MAZ-level components if needed
    # "highway_maz_skim",
    # "highway_maz_assign",
]

[emme]
# IMPORTANT: Update these paths for your test setup
# These paths are relative to the test directory (e.g., test_county/)
project_path = "emme_project"
highway_database_path = "emme_project/Database_highway"

# All-day base scenario ID (must exist in EMME database with network already loaded)
all_day_scenario_id = 100

# Single processor for testing
num_processors = 1

# Can optionally set up multi-processing distribution for larger tests
# [[emme.highway_distribution]]
# time_periods = ["EA", "AM"]
# num_processors = 2

# [[emme.highway_distribution]]
# time_periods = ["MD", "PM", "EV"]
# num_processors = 2

# Time periods - simplified for testing
# Using single time period for faster testing
[[time_periods]]
name = "AM"  # AM Peak
emme_scenario_id = 1
length_hours = 3.5
highway_capacity_factor = 1.0

# Additional time periods (commented out for single period testing)
# [[time_periods]]
# name = "EA"  # Early AM
# emme_scenario_id = 2
# length_hours = 3.0
# highway_capacity_factor = 1.0
#
# [[time_periods]]
# name = "MD"  # Midday
# emme_scenario_id = 3
# length_hours = 6.5
# highway_capacity_factor = 1.0
#
# [[time_periods]]
# name = "PM"  # PM Peak
# emme_scenario_id = 4
# length_hours = 4.0
# highway_capacity_factor = 1.0
#
# [[time_periods]]
# name = "EV"  # Evening
# emme_scenario_id = 5
# length_hours = 7.0
# highway_capacity_factor = 1.0

[warmstart]
# No warmstart for initial test
warmstart = false

[logging]
display_level = "STATUS"
run_file_path = "logs/tm2py_run.log"
run_file_level = "INFO"
log_file_path = "logs/tm2py_detail.log"
log_file_level = "DETAIL"
notify_slack = false
use_emme_logbook = true

[paths]
# Input paths - update these for your San Mateo subset data
landuse = "inputs/landuse"
highway = "inputs/hwy"
highway_demand_output = "inputs/demand"

# Output paths
skim_matrices = "skim_matrices"
loaded_highway = "loaded_highway"
