# San Mateo County Highway Test - Complete Model Configuration
# All required fields for HighwayConfig, HouseholdConfig, InternalExternalConfig, TruckConfig, ActiveModesConfig, TransitConfig, PostProcessorConfig

[highway]
# HighwayConfig - ALL required fields
generic_highway_mode_code = "a"
max_iterations = 100
network_acceleration = false
area_type_buffer_dist_miles = 2.0
output_skim_path = "skim_matrices/highway"
output_skim_filename_tmpl = "highway_skims_{time_period}.omx"
output_skim_matrixname_tmpl = "{time_period}_{mode}_{property}"
interchange_nodes_file = "inputs/hwy/interchange_nodes.csv"
model_to_emme_node_id_xwalk = "inputs/hwy/node_xwalk.csv"
output_node_sequential_id_xwalk = "inputs/hwy/node_seq_xwalk.csv"
apply_msa_demand = true
reliability = false

# Relative gap settings per global_iteration (required)
[[highway.relative_gaps]]
global_iteration = 0
relative_gap = 0.0001

[[highway.relative_gaps]]
global_iteration = 1
relative_gap = 0.0001

# Tolls configuration (required)
[highway.tolls]
file_path = "inputs/hwy/tolls.csv"
valuetoll_start_tollbooth_code = 1000000
src_vehicle_group_names = ["da", "s2", "s3", "vsm", "sml", "med", "lrg"]
dst_vehicle_group_names = ["da", "s2", "s3", "vsm", "sml", "med", "lrg"]

# MAZ to MAZ configuration (ALL required fields)
[highway.maz_to_maz]
mode_code = "z"
value_of_time = 18.93
operating_cost_per_mile = 0.20
max_distance = 30.0
max_skim_cost = 999999.0
excluded_links = []
demand_file = "inputs/demand/maz_demand.omx"
skim_period = "AM"
output_skim_file = "skim_matrices/maz_to_maz.omx"

[[highway.maz_to_maz.demand_county_groups]]
number = 1
counties = ["San Mateo"]

# Capacity class lookup (required)
[[highway.capclass_lookup]]
capclass = 1
capacity = 2000.0
free_flow_speed = 65.0
critical_speed = 50.0

# Highway classes (ALL required fields: veh_group_name, mode_code, skims, toll, demand)
[[highway.classes]]
name = "DA"
description = "Drive alone - free"
