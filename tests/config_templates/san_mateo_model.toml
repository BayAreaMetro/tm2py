# San Mateo County Highway Test - Model Configuration
# This contains the highway assignment parameters and class definitions

[highway]
# Highway assignment convergence parameters
relative_gap = 0.0001
max_iterations = 100
normalize_gap = 2

# Best relative gap - assignment stops if this is reached
best_relative_gap = 0.00001

# Skim parameters
skim_period = "AM"  # Which period to use as base for skimming (changed to AM for single-period testing)

# Value of reliability (cents per minute)
value_of_reliability = 1.5

# Operating cost (dollars per mile)
operating_cost_per_mile = 0.20

# Required fields
generic_highway_mode_code = "a"
network_acceleration = false
area_type_buffer_dist_miles = 2.0
output_skim_path = "skim_matrices/highway"
reliability = false
apply_msa_demand = true
interchange_nodes_file = "inputs/hwy/interchange_nodes.csv"  # Not used in test
model_to_emme_node_id_xwalk = "inputs/hwy/node_xwalk.csv"  # Not used in test  
output_node_sequential_id_xwalk = "inputs/hwy/node_seq_xwalk.csv"  # Not used in test

# Relative gap settings per iteration
[[highway.relative_gaps]]
iteration = 0
relative_gap = 0.0001

[[highway.relative_gaps]]
iteration = 1
relative_gap = 0.0001

# Capacity class lookup (stub - not used in test)
[[highway.capclass_lookup]]
capclass = 1
free_flow_speed = 65.0
capacity = 2000.0
critical_speed = 50.0

# Toll modes
[[highway.toll_mode]]
name = "toll"
excluded_links = []

# Highway vehicle classes
# Note: These are simplified for testing. Adjust based on your demand data.

[[highway.classes]]
name = "DA"
