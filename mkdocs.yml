plugins:
  # Basic plugins that should work without GDAL dependencies:
  - autorefs
  - git-revision-date-localized
  # - awesome-pages
  - mermaid2
  # Re-enabled mkdocstrings with proper mocking for GDAL dependencies
  - mkdocstrings:
      handlers:
        python:
          paths: [".", "tm2py"]
          options:
            # General formatting options
            show_root_heading: true
            show_source: true
            heading_level: 3
            docstring_style: google
            members_order: source
            
            # Enhanced visibility options
            show_bases: true
            show_signature_annotations: true
            show_category_heading: true
            group_by_category: true
            
            # Class and function display
            merge_init_into_class: true
            show_if_no_docstring: false
            show_signature: true
            separate_signature: true
            
            # Filter and organization
            filters: ["!^_"]
            
            # Enhanced attribute display
            show_object_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            
            # Improved docstring rendering
            docstring_section_style: "table"
            show_docstring_attributes: true
            show_docstring_functions: true
            show_docstring_classes: true
            show_docstring_modules: true
            
            # Additional options moved to extra
            extra:
              show_attributes: true
  - search

extra_css:
  - https://use.fontawesome.com/releases/v5.13.0/css/all.css

markdown_extensions:
  - admonition
  - codehilite:
      linenums: true
  - meta
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.smartsymbols
  - smarty
  - toc:
      # insert a blank space before the character
      permalink: " ¶"
